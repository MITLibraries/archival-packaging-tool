name: Prod Image Promote
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    name: Prod Promote
    uses: mitlibraries/.github/.github/workflows/ecr-multi-arch-promote-prod.yml@main
    secrets: inherit
    with:
      AWS_REGION: us-east-1
      GHA_ROLE_STAGE: archival-packaging-tool-gha-stage
      GHA_ROLE_PROD: archival-packaging-tool-gha-prod
      ECR_STAGE: archival-packaging-tool-stage
      ECR_PROD: archival-packaging-tool-prod
      FUNCTION: archival-packaging-tool-dev
