name: Dev Image Build and Deploy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    name: Dev Build and Push
    uses: mitlibraries/.github/.github/workflows/ecr-multi-arch-deploy-dev.yml@main
    secrets: inherit
    with:
      AWS_REGION: us-east-1
      GHA_ROLE: archival-packaging-tool-gha-dev
      ECR: archival-packaging-tool-dev
      FUNCTION: archival-packaging-tool-dev
      # PREBUILD: # Only if a pre-build dependency is required.
