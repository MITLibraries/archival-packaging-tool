[project]
name = "archival-packaging-tool"
version = "0.1.0"
description = "Create BagIt zip files from local and S3-hosted files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "bagit",
  "boto3",
  "jsonschema",
  "sentry-sdk",
  "setuptools",
]

[dependency-groups]
dev = [
  "boto3-stubs",
  "coveralls",
  "mypy",
  "pip-audit",
  "pre-commit",
  "pytest",
  "pytest-mock",
  "ruff",
  "types-jsonschema",
]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
exclude = ["tests/", "output/"] # output/ contains exploratory scripts, not application code.

[tool.pytest.ini_options]
log_level = "INFO"
filterwarnings = [
  "ignore::DeprecationWarning:bagit:",
]

[tool.ruff]
target-version = "py313"
line-length = 90
show-fixes = true

[tool.ruff.lint]
select = ["ALL", "PT"]
ignore = [
  "COM812",
  "D107",
  "N812",
  "PTH",
  "C90",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "S321",
  # Existing source and tests predate the project's copyright-header convention.
  "CPY001",
  # The following rules are retained for established application patterns.
  "EM101",
  "EM102",
  "G004",
  "TRY003",
]
fixable = ["E", "F", "I", "Q"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
  "ANN",
  "ARG001",
  "S101",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 90

[tool.ruff.lint.pydocstyle]
convention = "google"
